[alembic]
# Location of migration scripts, relative to the directory where alembic.ini lives.
script_location = database/migrations

# Make the project root importable so `database.*` imports work during migrations.
prepend_sys_path = .

# Separator between version numbers in generated filenames.
version_path_separator = os

# Default SQLAlchemy URL — overridden at runtime by the DATABASE_URL env var
# in database/migrations/env.py.  Do NOT put real credentials here.
sqlalchemy.url = driver://user:pass@localhost/dbname


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
