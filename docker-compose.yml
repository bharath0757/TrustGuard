version: '3.8'

services:
  frontend:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

  backend:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./database:/app/database
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://trustguard_user:${POSTGRES_PASSWORD:-changeme_dev_only}@postgres:5432/trustguard"
      APP_ENV: development
    depends_on:
      - postgres
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: trustguard_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      POSTGRES_DB: trustguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustguard_user -d trustguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
